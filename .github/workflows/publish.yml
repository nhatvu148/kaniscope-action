name: Publish image

# Publishes the action's container to GHCR so consumers pull it instead of
# compiling Rust on every run. action.yml pins the exact :vX.Y.Z image, which the
# shared workflow publishes from the tag.
#
# The floating :v1 IMAGE tag is still published, for one audience only: git tags
# cut before images were pinned (v0.1.28 and older) name :v1 in their
# action.yml, and stopping it would freeze them on whatever :v1 held last.
# Nothing current reads it.
#
# Ordering: the :vX.Y.Z image must exist BEFORE the floating v1 git tag moves to
# the commit that names it. Pushing the version tag runs this job, so tag first,
# wait for it, then move v1.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  # A tag whose action.yml names a different image would publish :vX.Y.Z while
  # every consumer of that tag ran some other image. Refuse before building.
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: action.yml runs this tag's own image
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            sh scripts/check-image-pin.sh "${GITHUB_REF_NAME}"
          else
            sh scripts/check-image-pin.sh
          fi

  publish:
    needs: pin
    uses: nhatvu148/shared-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      package-name: kaniscope-action
      # GHCR packages are private by default and action.yml pulls this image
      # anonymously, so a private package breaks every consumer while this job
      # still goes green. Fail the release instead.
      require-public: true
      # Gated on a version tag. workflow_dispatch has no ref guard, so without
      # `enable` a manual run from any branch would move the floating :v1 image
      # tag onto an untagged build - exactly the "tag first, then move v1"
      # ordering this file's header says is required.
      extra-tags: |
        type=raw,value=v1,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

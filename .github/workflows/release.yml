name: Release

# Cut the GitHub Release when a version tag is pushed.
#
# This repo is a Marketplace listing, so the Releases page is how people choose a
# version — and it had drifted four releases behind (tags at v0.1.8, Releases
# showing v0.1.3 as Latest) because creating the Release was a manual step after
# `git push origin vX.Y.Z`.
on:
  push:
    # `v*.*.*`, NOT `v*`: the floating `v1` tag is force-moved on every release and
    # must never cut a Release of its own.
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to cut a release for (e.g. v0.1.8)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the tag object for its annotation

      - name: Resolve tag
        run: echo "TAG=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Build notes
        run: |
          set -euo pipefail
          # There is no CHANGELOG here; releases are engine bumps, and the tag
          # annotation already says which engine version it carries. Fall back to
          # the commit subject if the tag is lightweight.
          NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            NOTES="$(git log -1 --format='%s%n%n%b' "$TAG")"
            echo "::warning::$TAG has no annotation — used the commit message"
          fi
          printf '%s\n' "$NOTES" > notes.md
          echo "--- notes ---"; head -20 notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent: a re-run, or a release cut by hand first, must not fail.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists — updating its notes"
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag --latest
          fi
